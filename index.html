<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shrekizzler Production</title>
<style>
  :root { --bg: #ffffff; --fg: #1b1b1e; --muted: #5c5c66; --accent: #2a9d8f; --card: #f2f3f7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14151f; --fg: #ededf2; --muted: #a0a0ad; --accent: #4cc9f0; --card: #1f2130; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 30px; margin: 0 0 4px; }
  h2 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
  .card { display: block; background: var(--card); border-radius: 16px; padding: 20px; margin: 24px 0; text-decoration: none; color: var(--fg); }
</style>
</head>
<body>
<main>
<h1>Shrekizzler Production</h1>
<p class="muted">Independent mobile games.</p>

<a class="card" href="silence-city/">
  <h2>Silence City</h2>
  <p class="muted" style="margin:0">An arcade game about smashing fictional ads and bringing silence back to the city.</p>
</a>

<p>Contact: <a href="mailto:rizzlershrekizzler@gmail.com">rizzlershrekizzler@gmail.com</a></p>
</main>
</body>
</html>
